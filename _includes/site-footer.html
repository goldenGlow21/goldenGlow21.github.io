{%- comment -%}
  Site title and profile links on one row, the copyright line under them.
{%- endcomment -%}
<footer class="site-footer">
  <div class="container site-footer-inner">
    <a class="site-title" href="{{ '/' | relative_url }}"><span class="site-mark" aria-hidden="true"></span>{{ site.title | escape }}</a>
    {% include profile-links.html class="footer-links" %}
  </div>
  <div class="container site-footer-base">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name | escape }}</span>
  </div>
</footer>
