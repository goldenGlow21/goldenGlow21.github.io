    tabWidth = 2
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[taxonomies]
  category = "categories"
  tag = "tags"

[[menus.main]]
  name = "~"
  weight = 1
  url = "/"

[[menus.main]]
  name = "posts"
  weight = 2
