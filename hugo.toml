baseURL = "https://goldenGlow21.github.io/"
languageCode = "en"
title = "goldenGlow21 :: ~"
paginate = 10
enableEmoji = false
enableRobotsTXT = true

[params]
  author = "goldenGlow21"
  realName = "Jonghoon Lee"
  host = "arch"
  description = "Security & Digital Forensics notebook"
  keywords = "security,forensics,cti,ctf,blog"
  avatarURL = "/images/arctic_fox.jpg"
  dateFormat = "2006-01-02"
  since = 2025
  email = "jonghoon8928@gmail.com"
  github = "https://github.com/goldenGlow21"
  linkedin = "https://www.linkedin.com/in/jonghoon-lee-882a05372/"

[markup]
