# Site identity. `title` is shown in the header and the browser tab;
# `description` is used for search result snippets and the feed subtitle.
title: goldenGlow21
description: ""
lang: ko
timezone: Asia/Seoul
url: "https://goldenGlow21.github.io"
baseurl: ""

author:
  name: Jonghoon Lee

# Comments are GitHub Discussions threads embedded by giscus (https://giscus.app).
# The ids below come from the giscus setup page for this repository.
# An empty `repo` turns comments off everywhere; `comments: false` in a post's
# front matter turns them off for that post only.
giscus:
  repo: goldenGlow21/goldenGlow21.github.io
  repo_id: R_kgDONpHwtg
  category: Comments
  category_id: DIC_kwDONpHwts4C_bW-

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed
  sourcemap: never

# Every file in _posts/ (and _drafts/ when previewing with --drafts) is a post.
# The URL is built from the file name without its date: /posts/<slug>/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      # Print "{{ }}" and "{% %}" in a post as written. Liquid would otherwise
      # execute them, which breaks template injection payloads in PoC code.
      render_with_liquid: false

exclude:
  - README.md
